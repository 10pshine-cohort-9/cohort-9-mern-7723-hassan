sonar.projectKey=HassanAhmed270_cohort-9-mern-7723-hassan
sonar.organization=hassanahmed270

# Name shown in the SonarCloud UI
sonar.projectName=cohort-9-mern-7723-hassan
sonar.projectVersion=1.0

# Where to scan (relative to this file, at repo root)
sonar.sources=backend,frontend

# Don't scan these — dependencies, build output, generated files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Don't factor these bootstrap/config files into the coverage percentage —
# they're wiring, not logic, so testing them adds no real verification value
sonar.coverage.exclusions=backend/config/**,backend/index.js,backend/tests/**,frontend/src/config.js,frontend/src/main.jsx,frontend/babel.config.cjs,frontend/jest.config.cjs

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8